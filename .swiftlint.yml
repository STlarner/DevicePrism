disabled_rules:
  - trailing_comma

opt_in_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - last_where
  - toggle_bool
  - closure_spacing
  - sorted_imports
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - multiline_arguments

included:
  - Sources
  - Tests
  - Demo/DevicePrismDemo

line_length:
  warning: 100
  error: 160

identifier_name:
  min_length: 2
  excluded:
    - id
